# Supabase free projects pause after about a week with no activity.
# This pings the project once a day so it stays awake. It only uses the public
# (publishable) key, which is safe to keep in the repository.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_blK8lyESy_cJafNKGxxGcQ_sg9xyiso" \
            "https://enrnlkndvvkqnfiqnjhn.supabase.co/rest/v1/profiles?select=id&limit=1")
          echo "Supabase responded with HTTP $status"
          test "$status" -lt 500
